name: native (FSR2 bridge)

on:
  push:
    paths: ["native/**", ".github/workflows/native.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: MinGW
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64
      - name: Build
        run: sh native/fsr2bridge/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fsr2bridge
          path: native/fsr2bridge/out/dinput8.dll
