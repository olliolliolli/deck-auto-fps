name: shader (FSR2 bridge sanitize)

# Компілює native/fsr2bridge/sanitize.hlsl у DXIL (офіційний DXC) і публікує заголовок
# sanitize_cs.h у pre-release fsr2bridge-dev — його кладуть у репозиторій, щоб збірка
# плагіна не залежала від DXC.
on:
  push:
    paths: ["native/fsr2bridge/*.hlsl", ".github/workflows/shader.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dxc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: DXC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/dxc && cd /tmp/dxc
          gh release download -R microsoft/DirectXShaderCompiler -p 'linux_dxc*.tar.gz' -O dxc.tgz
          tar xzf dxc.tgz
          ls -R | head -30
      - name: Compile
        run: |
          D=/tmp/dxc
          export LD_LIBRARY_PATH=$D/lib:$LD_LIBRARY_PATH
          $D/bin/dxc -T cs_6_0 -E main -O3 -Fh sanitize_cs.h -Vn g_sanitize_cs native/fsr2bridge/sanitize.hlsl
          $D/bin/dxc -T cs_6_0 -E main -O3 -Fo sanitize.cso native/fsr2bridge/sanitize.hlsl
          $D/bin/dxc -T cs_6_0 -E main -O3 -Fh repair_cs.h -Vn g_repair_cs native/fsr2bridge/repair.hlsl
          ls -la sanitize_cs.h sanitize.cso repair_cs.h
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view fsr2bridge-dev >/dev/null 2>&1 || \
            gh release create fsr2bridge-dev --prerelease --title "FSR2 bridge (dev)" --notes "dev"
          gh release upload fsr2bridge-dev sanitize_cs.h repair_cs.h --clobber
